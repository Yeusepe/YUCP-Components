name: Build Repo Listing

env:
  listPublishDirectory: Website
  pathToCi: ci
  packageNames: com.yucp.components com.yucp.ui
  
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: read
  
# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  
  build-listing:
    name: build-listing
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    runs-on: ubuntu-latest
    steps:
      
      # Checkout Local Repository
      - name: Checkout Local Repository
        uses: actions/checkout@v4

      # Checkout Automation Repository without removing prior checkouts
      - name: Checkout Automation Repository
        uses: actions/checkout@v4
        with:
          repository: vrchat-community/package-list-action
          path: ${{ env.pathToCi }}
          clean: false

      # Load cached data from previous runs
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.pathToCi }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}
      
      # Build Package Version Listing with Nuke
      - name: Build Package Version Listing
        run: |
          project="${{ env.pathToCi }}/PackageBuilder/PackageBuilder.csproj"
          dotnet build "$project" --framework net8.0
          for package in ${{ env.packageNames }}; do
            dotnet run --project "$project" --framework net8.0 --no-build -- \
              BuildRepoListing --root "${{ env.pathToCi }}" \
              --list-publish-directory "$GITHUB_WORKSPACE/${{ env.listPublishDirectory }}" \
              --current-package-name "$package" --current-listing-url "https://vpm.yucp.club/index.json"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge DevTools Listing
        shell: pwsh
        run: |
          ./.github/scripts/Merge-VpmListings.ps1 `
            -PrimaryIndexPath "$env:GITHUB_WORKSPACE/${{ env.listPublishDirectory }}/index.json" `
            -SecondaryIndexUrl "https://dev.vpm.yucp.club/index.json" `
            -ListingName "YUCP Club Packages" `
            -ListingId "com.yucp.importer.listing" `
            -ListingUrl "https://vpm.yucp.club/index.json" `
            -ListingAuthor "YUCP Club"

      # Prepare for GitHub Pages deployment
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      # Upload the VPM Listing Website to GitHub Pages artifacts
      - name: Upload Pages Artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.listPublishDirectory }}
      
  deploy:
    needs: build-listing
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The upload returns the artifact ID before Actions consistently lists it by name.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ARTIFACT_ID: ${{ needs.build-listing.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID)
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('The Pages upload did not return a valid artifact ID.')
            }
            const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            })
            core.setOutput('status_url', data.status_url)
            core.setOutput('page_url', data.page_url)

      - name: Wait for Pages deployment
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ steps.deployment.outputs.status_url }}
        run: |
          test -n "$STATUS_URL"
          while true; do
            sleep 5
            if status=$(gh api "$STATUS_URL" --jq '.status'); then
              echo "Pages deployment: $status"
              case "$status" in
                succeed) exit 0 ;;
                deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost) exit 1 ;;
              esac
            fi
          done

      - name: Cancel unfinished Pages deployment
        if: ${{ cancelled() && steps.deployment.outputs.status_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ steps.deployment.outputs.status_url }}
        run: gh api --method POST "$STATUS_URL/cancel"
